<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cybernetic Nano Grid // Live Stream Engine</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #020408;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .overlay-hud {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            font-family: monospace;
            z-index: 10;
        }

        .hud-badge {
            background: rgba(3, 7, 18, 0.75);
            border: 1px solid rgba(0, 255, 128, 0.3);
            padding: 6px 12px;
            border-radius: 6px;
            color: #00ff80;
            font-size: 10px;
            letter-spacing: 1px;
            backdrop-filter: blur(5px);
        }

        .hud-status {
            color: #38bdf8;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="overlay-hud">
        <div class="hud-badge">NANO_GRID // LIVE</div>
        <div class="hud-badge hud-status" id="activeNodes">NODES: 42</div>
    </div>

    <canvas id="nanoCanvas"></canvas>

    <script>
        const canvas = document.getElementById('nanoCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let particles = [];
        const numParticles = 45;

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 1.8;
                this.vy = (Math.random() - 0.5) * 1.8;
                this.radius = Math.random() * 3 + 1.5;
                this.color = Math.random() > 0.5 ? '#00ff80' : '#38bdf8';
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 12;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        for (let i = 0; i < numParticles; i++) {
            particles.push(new Particle());
        }

        function animate() {
            ctx.fillStyle = 'rgba(2, 4, 8, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // رسم الخطوط الشبكية التفاعلية بين الجزيئات
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();

                for (let j = i + 1; j < particles.length; j++) {
                    let dx = particles[i].x - particles[j].x;
                    let dy = particles[i].y - particles[j].y;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 130) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(0, 255, 128, ${1 - dist / 130})`;
                        ctx.lineWidth = 0.7;
                        ctx.stroke();
                    }
                }
            }

            requestAnimationFrame(animate);
        }

        animate();

        // تحديث إحصائيات وهمية تلقائياً
        setInterval(() => {
            let count = Math.floor(Math.random() * 15) + 35;
            document.getElementById('activeNodes').innerText = `NODES: ${count}`;
        }, 3000);
    </script>
</body>
</html>
